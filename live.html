
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">

<title>footballDop Live</title>
<style>
*{box-sizing:border-box}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}

.vs{color:#aaa;font-weight:bold}
.time{text-align:center;color:#bbb;font-size:14px}
.watch{display:block;text-align:center;background:#ff7900;color:white;text-decoration:none;padding:14px;border-radius:10px;font-weight:bold;margin-top:20px}
.footer{text-align:center;color:#777;font-size:12px;margin-top:35px}
</style>
</head>
